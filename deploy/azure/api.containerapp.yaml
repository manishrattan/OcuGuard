properties:
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: false
      allowInsecure: false
      targetPort: 5000
      transport: auto
  template:
    containers:
      - name: ocuguard-api
        image: REPLACE_WITH_PULLABLE_IMAGE
        command:
          - python
        args:
          - app.py
        env:
          - name: PORT
            value: "5000"
        resources:
          cpu: 0.5
          memory: 1Gi
        probes:
          - type: Liveness
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 30
    scale:
      minReplicas: 1
      maxReplicas: 1
